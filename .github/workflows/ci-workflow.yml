name: Python package
on:
  push:
  pull_request:
    branches: [ dev ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --all-groups
      # Ruff (PEP8 + linting)
      - name: Install Ruff
        run: uv tool install ruff
      - name: Lint code with Ruff
        run: ruff check . --output-format=github --target-version=py39
      - name: Check code formatting with Ruff
        run: ruff format . --check --target-version=py39
      # Vulture (détection de code mort)
      - name: Install Vulture
        run: uv tool install vulture
      - name: Detect dead code
        run: vulture . --min-confidence 80
      # Bandit (analyse de sécurité)
      - name: Install Bandit
        run: uv tool install bandit
      - name: Security analysis with Bandit
        run: bandit -r .
      # Detect-secrets (détection de secrets)
      - name: Install detect-secrets
        run: uv tool install detect-secrets
      - name: Detect secrets
        run: detect-secrets scan --all-files
      # Tests
      - name: Test with pytest
        run: uv run pytest
